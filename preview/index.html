<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>silent pet · 动作检查</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="mark">s<span>p</span></div><div><p class="eyebrow">SILENT PET / MOTION LAB</p><h1>让每一个小动作都自然。</h1></div><a href="../README.md" class="doc">项目说明 ↗</a></header>
<main>
<section class="stage-card">
  <div class="stage-top"><span id="mode-label">单个动作</span><span class="pill" id="state-name">安静待机</span></div>
  <div id="stage" class="stage checker" data-background="checker">
    <div class="baseline" aria-hidden="true"></div>
    <canvas id="pet" width="192" height="208" aria-label="宠物动作预览"></canvas>
    <div class="scale-note">192 × 208 · 实际宠物尺寸</div>
  </div>
  <div class="transport"><button id="play" type="button" aria-pressed="true">暂停</button><button id="previous" type="button" aria-label="上一帧">←</button><button id="next" type="button" aria-label="下一帧">→</button><span id="frame-label">第 1 / 6 帧</span><label>速度 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div>
  <div id="filmstrip" class="filmstrip" aria-label="逐帧检查"></div>
  <p id="hint" class="hint">点击下方缩略帧可暂停定位。基线用于检查脚底与角色大小。</p>
</section>
<aside>
  <section class="panel"><p class="eyebrow">01 / STATES</p><h2>九种状态</h2><div id="states" class="button-grid"></div></section>
  <section class="panel"><p class="eyebrow">02 / GAZE</p><h2>十六个方向</h2><div class="direction-tools"><button id="neutral" type="button">默认姿势</button><button id="look-loop" type="button">顺时针巡看</button><button id="pointer" type="button" aria-pressed="false">跟随预览区指针</button></div><div id="directions" class="directions"></div><p class="hint">这里可手动触发全部方向，不代表桌面应用中的触发规则。</p></section>
  <section class="panel"><p class="eyebrow">03 / TRANSITIONS</p><h2>连续切换</h2><div id="sequences" class="sequences"></div><p class="hint">直接切换原始帧，不加淡入淡出，方便看出尺寸跳动。</p></section>
  <section class="panel appearance"><label>背景 <select id="background" aria-label="背景"><option value="checker">透明网格</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>显示 <select id="zoom" aria-label="显示比例"><option value="0.5">0.5× 缩小检查</option><option value="1" selected>原始大小</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></section>
</aside>
</main>
<footer><span id="asset-status" role="status">正在读取图集…</span><span>仅在本地读取图片 · 无需账号或网络服务</span></footer>
<script type="module" src="app.mjs"></script>
</body></html>
